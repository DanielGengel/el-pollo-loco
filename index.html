<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <link rel="shortcut icon" href="./assets/img/favicon.png" type="image/x-icon" />
        <script src="main.js" type="module"></script>
        <title>EL POLLO LOCO</title>
    </head>
    <body>
        <h1>EL POLLO LOCO</h1>

        <div class="overlayContainer">
            <canvas id="canvas" width="720" height="480"></canvas>

            <!-- Always visible -->
            <div class="gameVolumeSettings">
                <button id="btnMuteIcon" class="speakerButton">🔊</button>
                <input id="volumeSlider" type="range" min="0" max="100" value="20" />
            </div>

            <div id="loadingScreen" class="overlay">
                <div class="menu">
                    <h2>Game starts in</h2>

                    <h1 id="countdown">3</h1>
                </div>
            </div>

            <!-- START SCREEN -->
            <div id="startScreen" class="overlay active">
                <div class="menu">
                    <button id="btnStart">START GAME</button>
                    <button id="btnInfo">INFO</button>
                    <button id="btnMute">SOUNDS OFF</button>
                    <button id="btnImprint">IMPRINT</button>
                </div>
            </div>

            <!-- GAME OVER SCREEN -->
            <!-- <div id="gameOverScreen" class="overlay">
                <div class="menu">
                    <h2>GAME OVER</h2>

                    <button id="btnRestart">PLAY AGAIN</button>
                    <button id="btnMenu">MAIN MENU</button>
                </div>
            </div> -->

            <div id="winScreen" class="overlay">
                <div class="menu">
                    <h2>🎉 YOU WON!</h2>
                    <button id="btnRestartWin">PLAY AGAIN</button>
                </div>
            </div>

            <div id="loseScreen" class="overlay">
                <div class="menu">
                    <h2>💀 GAME OVER</h2>
                    <button id="btnRestartLose">PLAY AGAIN</button>
                </div>
            </div>

            <!-- INFO POPUP -->
            <div id="infoPopup" class="popup hidden">
                <h3>How to Play</h3>

                <p>
                    Move with Arrow Keys OR ⬅️ ➡️<br />
                    Jump with SPACE OR ⬆️<br />
                    Throw bottles with D OR 🍼
                </p>

                <button class="closePopup">Close</button>
            </div>

            <!-- IMPRINT POPUP -->
            <div id="imprintPopup" class="popup hidden">
                <h3>Imprint</h3>

                <p>
                    Name<br />
                    Address<br />
                    Email
                </p>

                <button class="closePopup">Close</button>
            </div>

            <!-- <div id="mobileControls" class="mobileControls">
                <div class="mobileControlGroup">
                    <button class="mobileButton" id="btnMobileLeft">LEFT</button>
                    <button class="mobileButton" id="btnMobileRight">RIGHT</button>
                </div>

                <div class="mobileControlGroup">
                    <button class="mobileButton" id="btnMobileJump">JUMP</button>
                    <button class="mobileButton" id="btnMobileThrow">THROW</button>
                </div>
            </div> -->

            <div id="gameControls" class="gameControls hidden">
                <div class="mobileControlGroup">
                    <button class="gameButton" id="btnMobileLeft">⬅️</button>
                    <button class="gameButton" id="btnMobileRight">➡️</button>
                </div>

                <div class="mobileControlGroup">
                    <button class="gameButton" id="btnMobileJump">⬆️</button>

                    <button class="gameButton" id="btnMobileThrow">
                        <img src="./assets/img/6_salsa_bottle/2_salsa_bottle_on_ground.png" alt="Throw bottle" />
                    </button>
                </div>
            </div>
        </div>

        <div id="turnDeviceOverlay">
            <div class="menu">
                <h2>Please turn your device</h2>
                <p>Play in landscape mode.</p>
            </div>
        </div>
    </body>
</html>
